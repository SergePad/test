name: test
on:
  workflow_dispatch:
   inputs:
      project_name:
        type: string
        description: "name of the project"
      environment:
        type: string
        description: "environment"
      
jobs:
  test:
    runs-on: ubuntu-latest
    name: test
    steps:
     - name: test
       run: echo ${{ inputs.project_name}}.${{ inputs.environment }}

